name: Docker Image Publish

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.2.3)
        required: true
        type: string

# One publish at a time, so the check for the newest tag below can't race
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  build:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    permissions:
      contents: read
      packages: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # latest, v1 and v1.2 only move to the newest release, so re-running
      # the publish of an older one doesn't move them back
      - name: Check whether this is the newest release
        id: newest
        run: |
          git fetch -q --tags origin
          NEWEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "Newest release: $NEWEST, publishing: $TAG"
          echo "is_newest=$([ "$NEWEST" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log into GHCR for the build cache
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # actual-26.11.0 and actual-26.11 name the bundled Actual CLI, for
      # users who keep the image in step with their server
      - name: Read the Actual CLI version
        id: cli
        run: |
          VERSION=$(jq -r '.packages["node_modules/@actual-app/cli"].version' package-lock.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: rodriguestiago0/actualbudget-backup
          # v1.2.3, plus v1.2, v1 and latest that follow the newest release
          tags: |
            type=raw,value=${{ env.TAG }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ env.TAG }},enable=${{ steps.newest.outputs.is_newest }}
            type=semver,pattern=v{{major}},value=${{ env.TAG }},enable=${{ steps.newest.outputs.is_newest }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.is_newest }}
            type=raw,value=actual-${{ steps.cli.outputs.version }},enable=${{ steps.newest.outputs.is_newest }}
            type=raw,value=actual-${{ steps.cli.outputs.minor }},enable=${{ steps.newest.outputs.is_newest }}
          flavor: latest=false

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: 'linux/amd64,linux/arm64,linux/arm/v7'
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          # Reads the cache main's CI build wrote for this commit; doesn't
          # write it, so publishing an older tag can't overwrite main's
          cache-from: type=registry,ref=ghcr.io/rodriguestiago0/actualbudget-backup:buildcache

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/rodriguestiago0/actualbudget-backup
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

