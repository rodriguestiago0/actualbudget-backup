name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  # test and build are cancelled when a newer commit arrives for the same
  # branch/PR, so a burst of merges produces a single release. The release
  # and publish jobs are never cancelled once started.
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run unit tests
        run: bats test/*.bats

      - name: Shellcheck
        run: shellcheck scripts/*.sh test/e2e/run.sh

      # also shellchecks the run: blocks of the workflows
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    # PRs only build amd64 to stay fast; main builds every published
    # platform so a broken arch blocks the release. Dependabot PRs build
    # them all too, since they can merge on their own.
    env:
      ALL_PLATFORMS: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: env.ALL_PLATFORMS == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: ${{ env.ALL_PLATFORMS == 'true' && 'linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7' || 'linux/amd64' }}
          tags: actualbudget-backup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Rebuilds amd64 from the cache above, to run it
      - name: Load the amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: actualbudget-backup:ci
          cache-from: type=gha

      - name: Smoke test the image
        run: |
          # through the entrypoint, as users run them
          docker run --rm actualbudget-backup:ci rclone version
          docker run --rm actualbudget-backup:ci shoutrrr --version
          docker run --rm --entrypoint sh actualbudget-backup:ci -c '
            set -e
            actual --version
            7z i > /dev/null
            command -v supercronic su-exec curl > /dev/null
            for f in /app/*.sh; do bash -n "$f"; done
          '

      # Backs up a known budget from a real Actual server and checks the
      # backup holds the same budget
      - name: End-to-end backup test
        run: test/e2e/run.sh actualbudget-backup:ci

  # Releases everything merged since the last tag, not only this commit:
  # when a newer push cancels this run's build, the newer run releases it.
  # Commits marked [skip release], or that don't change what goes into the
  # image (docs, tests, CI), are not released on their own.
  release:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-bump version tag
        id: bump
        run: |
          if [ -n "$(git tag --contains HEAD)" ]; then
            echo "Already released by a newer run: $(git tag --contains HEAD | head -1)"
            exit 0
          fi

          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          RANGE="${LATEST_TAG}..HEAD"
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            RANGE="HEAD"
          fi

          RELEASE=false
          BUMP="patch"
          for COMMIT in $(git rev-list --first-parent "$RANGE"); do
            MSG=$(git log -1 --format=%B "$COMMIT")
            SUBJECT=$(git log -1 --format=%s "$COMMIT")
            if echo "$MSG" | grep -q '\[skip release\]'; then
              echo "Skipped ([skip release]): $SUBJECT"
              continue
            fi
            if ! git diff --name-only "${COMMIT}^1" "$COMMIT" | grep -qE '^(Dockerfile|\.dockerignore|package(-lock)?\.json|scripts/)'; then
              echo "Skipped (image unchanged): $SUBJECT"
              continue
            fi
            echo "Included: $SUBJECT"
            RELEASE=true
            if echo "$MSG" | grep -q '\[major\]'; then
              BUMP="major"
            elif echo "$MSG" | grep -q '\[minor\]' && [ "$BUMP" != major ]; then
              BUMP="minor"
            fi
          done

          if [ "$RELEASE" != true ]; then
            echo "Nothing to release"
            exit 0
          fi

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "Bumping $BUMP version"

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"

          # GITHUB_TOKEN cannot tag a commit whose workflow files differ from
          # main's, which happens when a newer push changed them. That push's
          # run releases this commit too.
          if ! git push origin "$NEW_TAG"; then
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              echo "::notice::Tag push rejected; main has moved on, its run will release these changes."
              exit 0
            fi
            exit 1
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          CLI_VERSION=$(jq -r '.packages["node_modules/@actual-app/cli"].version' package-lock.json)
          gh release create "$NEW_TAG" \
            --title "$NEW_TAG" \
            --notes "Built with @actual-app/cli ${CLI_VERSION}: backups import into Actual ${CLI_VERSION} or newer." \
            --generate-notes

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # the `release: published` event in docker-image.yml never fires for it.
  # Call the publish workflow directly instead.
  publish:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
