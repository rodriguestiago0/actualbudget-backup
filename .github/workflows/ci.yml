name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  # On a PR, test and build are cancelled when a newer commit arrives. On
  # main they are not: a cold-cache build takes over 30 minutes and only
  # saves its cache at the end, so cancelling it would delay the release.
  # A newer run waits instead, and replaces any run already waiting, so a
  # burst of merges still produces a single release. The release and
  # publish jobs are never cancelled once started.
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run unit tests
        run: bats test/*.bats

      - name: Shellcheck
        run: shellcheck scripts/*.sh test/e2e/run.sh .github/scripts/*.sh

      # also shellchecks the run: blocks of the workflows
      - name: Actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color

  # Whether anything since the last tag changes the image, the same check the
  # release uses. When nothing does, main builds amd64 only and leaves the
  # build cache alone, since an amd64-only cache would drop the ARM layers.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.plan.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check what changed since the last release
        id: plan
        run: .github/scripts/release-plan.sh >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      # main writes the build cache; PR tokens (forks, Dependabot) are
      # read-only, so they can only read it
      packages: write
    # PRs only build amd64 to stay fast; main builds every published
    # platform so a broken arch blocks the release, unless the image can't
    # have changed. Dependabot PRs build them all too, since they can merge
    # on their own.
    env:
      ALL_PLATFORMS: ${{ (github.event_name == 'push' && needs.changes.outputs.image == 'true') || github.event.pull_request.user.login == 'dependabot[bot]' }}
      # Registry cache: unlike the GHA cache it is not evicted after 7 days
      # unused, and PRs can read what main wrote
      CACHE_REF: ghcr.io/rodriguestiago0/actualbudget-backup:buildcache

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: env.ALL_PLATFORMS == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log into GHCR for the build cache
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: ${{ env.ALL_PLATFORMS == 'true' && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}
          tags: actualbudget-backup:ci
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name == 'push' && env.ALL_PLATFORMS == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.CACHE_REF) || '' }}

      # Rebuilds amd64 from the cache above, to run it
      - name: Load the amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: actualbudget-backup:ci
          cache-from: type=registry,ref=${{ env.CACHE_REF }}

      - name: Smoke test the image
        run: |
          # through the entrypoint, as users run them
          docker run --rm actualbudget-backup:ci rclone version
          docker run --rm actualbudget-backup:ci shoutrrr --version
          docker run --rm --entrypoint sh actualbudget-backup:ci -c '
            set -e
            actual --version
            7z i > /dev/null
            command -v supercronic su-exec curl > /dev/null
            for f in /app/*.sh; do bash -n "$f"; done
          '

      # Backs up a known budget from a real Actual server and checks the
      # backup holds the same budget
      - name: End-to-end backup test
        run: test/e2e/run.sh actualbudget-backup:ci

  # Releases everything merged since the last tag, not only this commit:
  # when a newer push cancels this run's build, the newer run releases it.
  # Commits marked [skip release], or that change neither the image nor the
  # systemd units (docs, tests, CI), are not released on their own; see
  # .github/scripts/release-plan.sh and .github/CONTRIBUTING.md. The release
  # is created as a draft and only published once its image is.
  release:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Auto-bump version tag
        id: bump
        run: |
          if [ -n "$(git tag --contains HEAD)" ]; then
            echo "Already released by a newer run: $(git tag --contains HEAD | head -1)"
            exit 0
          fi

          # see the script for what is released and the version markers
          .github/scripts/release-plan.sh "$RUNNER_TEMP/changes.md" > "$RUNNER_TEMP/plan"
          RELEASE=$(sed -n 's/^release=//p' "$RUNNER_TEMP/plan")
          BUMP=$(sed -n 's/^bump=//p' "$RUNNER_TEMP/plan")
          LATEST_TAG=$(sed -n 's/^latest_tag=//p' "$RUNNER_TEMP/plan")

          if [ "$RELEASE" != true ]; then
            echo "Nothing to release"
            exit 0
          fi

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          echo "Bumping $BUMP version"

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"

          # GITHUB_TOKEN cannot tag a commit whose workflow files differ from
          # main's, which happens when a newer push changed them. That push's
          # run releases this commit too.
          if ! git push origin "$NEW_TAG"; then
            git fetch -q origin main
            if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
              echo "::notice::Tag push rejected; main has moved on, its run will release these changes."
              exit 0
            fi
            exit 1
          fi

          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # Only the released changes, not every PR merged since the last tag
      - name: Create a draft GitHub Release
        if: steps.bump.outputs.new_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
          PREVIOUS_TAG: ${{ steps.bump.outputs.previous_tag }}
          REPO: ${{ github.repository }}
        run: |
          CLI_VERSION=$(jq -r '.packages["node_modules/@actual-app/cli"].version' package-lock.json)
          {
            echo "Built with @actual-app/cli ${CLI_VERSION}: backups import into Actual ${CLI_VERSION} or newer."
            echo
            echo "## Changes"
            echo
            cat "$RUNNER_TEMP/changes.md"
            echo
            echo "**Full changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${NEW_TAG}"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$NEW_TAG" --draft --title "$NEW_TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # the `release: published` event in docker-image.yml never fires for it.
  # Call the publish workflow directly instead.
  publish:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

  # Publishes the draft release once its image is on Docker Hub, so a
  # release never points at an image that failed to push
  finish-release:
    needs: [release, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$NEW_TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
