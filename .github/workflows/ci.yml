name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run unit tests
        run: bats test/*.bats

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PRs only build amd64 to stay fast; main builds every published
      # platform so a broken arch blocks the release.
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7' || 'linux/amd64' }}
          tags: actualbudget-backup:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Auto-bump version tag
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)

          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -q '\[major\]'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            echo "Bumping major version"
          elif echo "$COMMIT_MSG" | grep -q '\[minor\]'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            echo "Bumping minor version"
          else
            PATCH=$((PATCH + 1))
            echo "Bumping patch version"
          fi

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.bump.outputs.new_tag }}
        run: |
          gh release create "$NEW_TAG" \
            --title "$NEW_TAG" \
            --generate-notes

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # the `release: published` event in docker-image.yml never fires for it.
  # Call the publish workflow directly instead.
  publish:
    needs: release
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
